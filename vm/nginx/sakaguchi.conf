log_format sakaguchi_timing '$remote_addr - $request_method $uri $status '
                             'request_time=$request_time upstream_time=$upstream_response_time '
                             'bytes=$body_bytes_sent';

upstream sakaguchi_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /opt/sakaguchi/current/dist;

  access_log /var/log/nginx/sakaguchi_access.log sakaguchi_timing;

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://sakaguchi_app;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
